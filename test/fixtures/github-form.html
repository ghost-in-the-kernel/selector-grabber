<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>New repository</title></head>
<body>
<!-- Modeled on the structure of a deeply nested React form (GitHub's "new repository" page):
     React 19 ids (_r_c_), wrapper divs many levels deep, the same account name in several places. -->
<div class="position-relative">
  <header>
    <a href="/">Home</a>
    <button type="button" aria-label="Open user navigation menu"><img alt="ghost-in-the-kernel" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="20" height="20"></button>
  </header>
</div>
<div></div><div></div><div></div><div></div>
<div class="application-main">
  <main>
    <react-app>
      <div>
        <form>
          <div><h1>Create a new repository</h1></div>
          <div><p>Repositories contain a project's files and version history.</p></div>
          <div>
            <div>
              <div><h2>General</h2></div>
              <div>
                <div>
                  <div>
                    <fieldset>
                      <legend class="sr-only">Repository owner and name</legend>
                      <div>
                        <div>
                          <span class="label">Owner <span>(required)</span>*</span>
                          <button type="button" aria-haspopup="true" id="_r_5_">
                            <span><span><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="16" height="16"></span><span>ghost-in-the-kernel</span></span>
                            <span><svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"></path></svg></span>
                          </button>
                        </div>
                        <div><span>/</span></div>
                        <div>
                          <label for="_r_7_">Repository name <span>(required)</span>*</label>
                          <input id="_r_7_" type="text" aria-required="true">
                        </div>
                      </div>
                    </fieldset>
                  </div>
                </div>
              </div>
            </div>
            <div>
              <label for="_r_c_">Description</label>
              <input id="_r_c_" type="text">
              <span>0 / 350 characters</span>
            </div>
          </div>
          <div><button type="submit">Create repository</button></div>
        </form>
      </div>
    </react-app>
  </main>
</div>
<footer>
  <h2 class="sr-only">Footer</h2>
  <ul><li><a href="/site/terms">Terms</a></li><li><a href="/site/privacy">Privacy</a></li></ul>
  <p>Signed in as <strong>ghost-in-the-kernel</strong></p>
</footer>
</body>
</html>
